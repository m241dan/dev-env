# Loaded via CONTAINERS_CONF_OVERRIDE so it wins over anything in the
# bind-mounted host ~/.config/containers/containers.conf
[containers]
# Re-use the outer /proc; mounting a fresh procfs fails because the outer
# container masks parts of /proc
volumes = ["/proc:/proc"]
default_sysctls = []
# Nested containers share the dev-env's network (ports published by
# run-env.sh are reachable from nested containers)
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
# No systemd/journald inside the dev-env
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
