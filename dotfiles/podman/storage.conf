# Loaded via CONTAINERS_STORAGE_CONF so nested podman never touches the
# host's ~/.local/share/containers (the host $HOME is bind-mounted)
[storage]
driver = "overlay"
graphroot = "/var/lib/dev-env-containers/storage"
# Not persisted across container restarts, on purpose
runroot = "/tmp/dev-env-containers-run"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
