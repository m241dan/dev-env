# For good colors and fancy stuff
set -g default-terminal "xterm-256color"
set -as terminal-overrides ",xterm*:Tc"

# For copy and paste
set -g set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

# Rebind the Leader key
set -g prefix C-a

# Let's use vim keys!
setw -g mode-keys vi

# Change selecting panes to use vim keys
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Make new windows start with the same path as the one it is being created from
bind-key c new-window -c "#{pane_current_path}"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux_plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'

# Theme: Tmux 2k configs (tmux2k 2.x option names)
set -g @tmux2k-left-plugins "session git cpu ram"
set -g @tmux2k-right-plugins "battery network time"
set -g @tmux2k-show-powerline true
set -g @tmux2k-time-format "%a %H:%M" # 24 hour clock (replaces @tmux2k-military-time)


# available colors: white, gray (dark gray), black, and [light_|dark_]{blue,green,orange,pink,purple,red,yellow}
# set -g @tmux2k-[plugin-name]-colors "[background] [foreground]"
set -g @tmux2k-cpu-colors "blue gray"


# icon shown by the session plugin (replaces @tmux2k-show-left-icon)
set -g @tmux2k-session-icon ""


# update powerline symbols
set -g @tmux2k-left-sep ""
set -g @tmux2k-right-sep ""


# change refresh rate
set -g @tmux2k-refresh-rate 5

# End Theme configs


run "~/.tmux_plugins/tpm/tpm"
